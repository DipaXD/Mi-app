{% extends 'base.html' %}
{% block title %}Formulario Producto{% endblock %}
{% block content %}

<div class="glass-card mx-auto p-4 p-md-5" style="max-width: 600px; margin-top: 40px;">
    <h2 class="fw-bold text-center mb-4">
        {{ form.instance.id|yesno:"✏️ Editar Producto,✨ Agregar Producto" }}
    </h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-glow w-100 py-3 mt-4 fw-bold fs-5 rounded-pill">💾 Guardar Cambios</button>
        <a href="/" class="btn btn-outline-light w-100 py-2 mt-3 fw-bold rounded-pill">Cancelar</a>
    </form>
</div>
{% endblock %}
