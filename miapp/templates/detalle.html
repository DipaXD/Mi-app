<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body{
            font-family:'Poppins',sans-serif;
            background-image: url("https://4529938.fs1.hubspotusercontent-na1.net/hubfs/4529938/productos-tecnologicos-2.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px;
        }

        .box{
            max-width:800px;
            width:100%;
            background:white;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 20px 40px rgba(0,0,0,.12);
            transition:.4s;
        }

        .box:hover{
            transform:translateY(-5px);
        }

        img{
            width:100%;
            height:450px;
            object-fit:cover;
            display:block;
        }

        .info{
            padding:30px;
        }

        h2{
            font-weight:700;
            color:#0f172a;
            margin-bottom:15px;
        }

        .descripcion{
            color:#64748b;
            font-size:1rem;
            line-height:1.8;
            margin-bottom:25px;
        }

        .precio{
            font-size:2rem;
            font-weight:700;
            color:#10b981;
            margin-bottom:25px;
        }

        .btn-volver{
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:12px;
            font-weight:600;
            text-decoration:none;
            transition:.3s;
            display:inline-block;
        }

        .btn-volver:hover{
            background:linear-gradient(135deg,#1d4ed8,#2563eb);
            transform:translateY(-2px);
            color:white;
        }

        .badge-producto{
            display:inline-block;
            background:#dbeafe;
            color:#2563eb;
            padding:8px 15px;
            border-radius:20px;
            font-size:.85rem;
            margin-bottom:15px;
            font-weight:600;
        }

        .no-image{
            width:100%;
            height:300px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f1f5f9;
            color:#64748b;
            font-weight:500;
        }

        @media(max-width:768px){
            img{
                height:250px;
            }

            .precio{
                font-size:1.6rem;
            }
        }
    </style>
</head>

<body>

<div class="box">

    {% if producto.imagen %}
        <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}">
    {% else %}
        <div class="no-image">
            Sin imagen disponible
        </div>
    {% endif %}

    <div class="info">

        {% if producto.destacado %}
        <span class="badge-producto">
            ⭐ Producto Destacado
        </span>
        {% else %}
        <span class="badge-producto">
            🛍️ Producto
        </span>
        {% endif %}

        <h2>{{ producto.nombre }}</h2>

        <p class="descripcion">
            {{ producto.descripcion }}
        </p>

        <div class="precio">
            ${{ producto.precio }}
        </div>

        <a href="/" class="btn btn-primary px-4 py-2 rounded-3">
            ← Volver al catálogo
        </a>

    </div>

</div>

</body>
</html>
