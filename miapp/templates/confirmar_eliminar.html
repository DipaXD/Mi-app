{% extends 'base.html' %}
{% block content %}

<style>
body {
    background-image: url("https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop");
    background-size: cover;
    background-attachment: fixed;
}
.delete-card {
    max-width: 500px;
    margin: 100px auto;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 25px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(239, 68, 68, 0.2); /* Brillo rojo */
    color: white;
    text-align: center;
}
</style>

<div class="delete-card">
    <h3 class="fw-bold mb-3">¿Seguro que quieres eliminar?</h3>
    <p class="fs-5 text-warning mb-4"><strong>{{ producto.nombre }}</strong></p>
    
    <form method="POST" class="d-flex justify-content-center gap-3">
        {% csrf_token %}
        <a href="/" class="btn btn-secondary px-4 py-2 rounded-3 fw-bold">Cancelar</a>
        <button class="btn btn-danger px-4 py-2 rounded-3 fw-bold" style="box-shadow: 0 0 15px rgba(239,68,68,0.5);">Sí, eliminar</button>
    </form>
</div>
{% endblock %}
