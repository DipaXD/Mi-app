{% extends 'base.html' %}
{% block title %}Agregar Producto{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 glass-panel p-4">
        <h2 class="fw-bold mb-4 text-dynamic">Subir Nuevo Producto</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-gradient w-100 py-2 mt-3">Guardar Producto</button>
        </form>
    </div>
</div>
{% endblock %}
