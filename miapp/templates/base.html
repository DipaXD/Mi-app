<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Tienda{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background: linear-gradient(135deg,#eef2ff,#f8fafc);
            min-height:100vh;
            color:#2d3748;
            
        }

        /* NAVBAR */
        .navbar-custom{
            background: linear-gradient(90deg,#0f172a,#1e293b);
            box-shadow:0 4px 20px rgba(0,0,0,.15);
            padding:12px 0;
        }

        .navbar-brand{
            font-size:1.5rem;
            font-weight:700;
            letter-spacing:1px;
        }

        .navbar-custom .nav-link{
            color:white !important;
            margin-left:10px;
            font-weight:500;
            transition:all .3s ease;
            border-radius:8px;
            padding:8px 14px !important;
        }

        .navbar-custom .nav-link:hover{
            background:rgba(255,255,255,.12);
            color:#60a5fa !important;
            transform:translateY(-2px);
        }

        .navbar-custom {
        background: rgba(10, 10, 10, 0.75);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .navbar-custom .navbar-brand {
            color: #ffffff !important;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .navbar-custom .nav-link {
            color: rgba(255,255,255,0.85) !important;
            transition: 0.3s;
        }

        .navbar-custom .nav-link:hover {
            color: #ffffff !important;
            transform: translateY(-1px);
        }

        /* CONTENEDOR */
        .container-page{
            margin-top:40px;
            margin-bottom:40px;
        }

        /* TARJETAS */
        .card{
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
            transition:all .35s ease;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 18px 35px rgba(0,0,0,.15);
        }

        .card-header{
            background:linear-gradient(135deg,#2563eb,#3b82f6);
            color:white;
            font-weight:600;
            border:none;
        }

        /* BOTONES */
        .btn{
            border-radius:10px;
            font-weight:600;
            transition:.3s;
        }

        .btn-primary{
            background:#2563eb;
            border:none;
        }

        .btn-primary:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .btn-success{
            background:#10b981;
            border:none;
        }

        .btn-success:hover{
            background:#059669;
            transform:translateY(-2px);
        }

        .btn-danger{
            background:#ef4444;
            border:none;
        }

        .btn-danger:hover{
            background:#dc2626;
            transform:translateY(-2px);
        }

        /* FORMULARIOS */
        .form-control{
            border-radius:12px;
            border:1px solid #dbeafe;
            padding:12px;
            transition:.3s;
        }

        .form-control:focus{
            border-color:#3b82f6;
            box-shadow:0 0 0 .2rem rgba(59,130,246,.20);
        }

        /* TABLAS */
        table{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.05);
        }

        thead{
            background:#1e293b;
            color:white;
        }

        /* TITULOS */
        h1,h2,h3,h4,h5{
            font-weight:700;
            color:#0f172a;
        }

        /* ALERTAS */
        .alert{
            border:none;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        /* FOOTER opcional */
        footer{
            margin-top:60px;
            text-align:center;
            color:#64748b;
            padding:20px;
        }

        /* RESPONSIVE */
        @media(max-width:768px){

            .navbar-brand{
                font-size:1.2rem;
            }

            .container-page{
                margin-top:20px;
                padding:10px;
            }

            .card{
                margin-bottom:20px;
            }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">Mi Tienda</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/crear/">Agregar Producto</a></li>
                <li class="nav-item"><a class="nav-link" href="/perfil/">Configuración</a></li>

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <form action="{% url 'logout' %}" method="POST" style="display:inline;">
                            {% csrf_token %}
                            <button class="btn btn-danger btn-sm">Cerrar sesión</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item"><a class="nav-link btn btn-primary btn-sm text-white" href="{% url 'login' %}">Login</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-success btn-sm text-white" href="{% url 'registro' %}">Registro</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container container-page">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
