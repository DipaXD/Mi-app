{% extends 'base.html' %}

{% block title %}Iniciar Sesión - UrbanPulse{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        
        <div class="glass-panel p-4 p-md-5 shadow-lg animate__animated animate__fadeInUp">
            
            <!-- Encabezado del Formulario -->
            <div class="text-center mb-4">
                <div class="mb-2">
                    <span class="fa-stack fa-2x" style="color: var(--primary);">
                        <i class="fa-solid fa-circle fa-stack-2x" style="opacity: 0.15;"></i>
                        <i class="fa-solid fa-lock fa-stack-1x"></i>
                    </span>
                </div>
                <h3 class="fw-bold text-dark mb-1">¡Bienvenido!</h3>
                <p class="text-muted small">Ingresá a tu cuenta en UrbanPulse</p>
            </div>

            <!-- Formulario -->
            <form method="POST" autocomplete="off">
                {% csrf_token %}

                <!-- Campo Usuario / Username -->
                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuario</label>
                    <div class="input-group-custom">
                        <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                        <!-- Usamos el campo de usuario o el renderizado de Django -->
                        <input type="text" name="username" id="id_username" class="form-control-custom" placeholder="Ingresá tu usuario" required autofocus>
                    </div>
                </div>

                <!-- Campo Contraseña Mejorado (Tipo Password + Botón Mostrar/Ocultar) -->
                <div class="mb-4">
                    <label for="id_password" class="form-label">Contraseña</label>
                    <div class="input-group-custom position-relative">
                        <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                        <input type="password" name="password" id="id_password" class="form-control-custom pe-5" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="btn-toggle-pass">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón de Ingreso -->
                <button type="submit" class="btn btn-gradient w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar
                </button>

                <!-- Enlace de Registro -->
                <div class="text-center">
                    <p class="small text-muted mb-0">¿No tenés una cuenta? <a href="{% url 'registro' %}" class="text-primary fw-semibold text-decoration-none">Registrate acá</a></p>
                </div>
            </form>

        </div>

    </div>
</div>

<!-- Estilos específicos y Script para mostrar/ocultar contraseña -->
<style>
    .input-group-custom {
        position: relative;
        display: flex;
        align-items: center;
    }
    .input-icon {
        position: absolute;
        left: 15px;
        color: #64748b;
        font-size: 0.95rem;
        z-index: 10;
    }
    .form-control-custom {
        width: 100%;
        padding: 10px 15px 10px 42px !important;
        border-radius: 12px !important;
        background: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        font-size: 0.9rem;
        color: #0f172a !important;
        transition: all 0.2s ease;
    }
    .form-control-custom:focus {
        border-color: var(--primary) !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 3px var(--primary-glow) !important;
        outline: none;
    }
    .btn-toggle-pass {
        position: absolute;
        right: 12px;
        background: transparent;
        border: none;
        color: #64748b;
        cursor: pointer;
        padding: 4px;
        z-index: 10;
        transition: color 0.2s;
    }
    .btn-toggle-pass:hover {
        color: var(--primary);
    }
</style>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('id_password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    });
</script>
{% endblock %}
