{% extends 'base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}

<style>
body {
    background-image: url("https://4529938.fs1.hubspotusercontent-na1.net/hubfs/4529938/productos-tecnologicos-2.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.login-container{
    max-width:500px;
    margin:auto;
}

.login-card{
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.10);
    animation:fadeIn .5s ease;
}

.login-title{
    text-align:center;
    font-weight:700;
    margin-bottom:25px;
    color:#0f172a;
}

.login-card p{
    margin-bottom:15px;
}

.login-card label{
    font-weight:600;
    color:#334155;
    margin-bottom:6px;
    display:block;
}

.login-card input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #dbeafe;
    transition:.3s;
}

.login-card input:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 0 .2rem rgba(59,130,246,.15);
}

.btn-login{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    font-weight:600;
    transition:.3s;
}

.btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(37,99,235,.25);
}

.login-footer{
    text-align:center;
    margin-top:15px;
    font-size:.9rem;
}

.login-footer a{
    color:#2563eb;
    text-decoration:none;
    font-weight:600;
}

.login-footer a:hover{
    text-decoration:underline;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>

<div class="login-container">

    <div class="login-card">

        <h2 class="login-title">🔐 Iniciar sesión</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn-login">
                Entrar
            </button>
        </form>

        <div class="login-footer">
            ¿No tienes cuenta?
            <a href="{% url 'registro' %}">Regístrate aquí</a>
        </div>

    </div>

</div>

{% endblock %}
