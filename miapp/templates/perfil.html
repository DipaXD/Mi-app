{% extends 'base.html' %}

{% block title %}Perfil{% endblock %}

{% block content %}

<style>
body {
    background-image: url("https://4529938.fs1.hubspotusercontent-na1.net/hubfs/4529938/productos-tecnologicos-2.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* overlay para que se lea todo */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

.profile-container{
    max-width:700px;
    margin:40px auto;
}

.profile-card{
    background:white;
    border:none;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.20);
}

.profile-header{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    padding:40px;
    text-align:center;
    color:white;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    background:white;
    color:#2563eb;
    font-size:42px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    margin-bottom:15px;
}

.profile-body{
    padding:30px;
}

.info-box{
    background:#f8fafc;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    border-left:5px solid #2563eb;
}

.info-label{
    font-size:.85rem;
    color:#64748b;
    font-weight:600;
    text-transform:uppercase;
}

.info-value{
    font-size:1.1rem;
    font-weight:600;
    color:#0f172a;
}

/* 👇 TEXTO BLANCO ARRIBA */
.panel-title {
    color: white;
    text-align: center;
    font-weight: 700;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
}

.panel-text {
    color: white;
    text-align: center;
    margin-bottom: 25px;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
}

.btn-profile{
    background:linear-gradient(135deg,#10b981,#059669);
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn-profile:hover{
    transform:translateY(-2px);
    color:white;
}
</style>

<div class="panel-title">
    👤 Mi Panel
</div>

<div class="panel-text">
    Total productos: {{ total }}
</div>

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar">
                {{ user.username|first|upper }}
            </div>

            <h2>{{ user.username }}</h2>
            <p class="mb-0">Mi Cuenta</p>

        </div>

        <div class="profile-body">

            <div class="info-box">
                <div class="info-label">Usuario</div>
                <div class="info-value">{{ user.username }}</div>
            </div>

            <div class="info-box">
                <div class="info-label">Correo Electrónico</div>
                <div class="info-value">{{ user.email }}</div>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="btn-profile">
                    🏠 Volver al Inicio
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
